<style>
/* Layout: full-bleed map; a floating strip-board header, a slide-in detail panel
   (right column on wide screens, bottom sheet on phones), legend bottom-left. */
:root{
  color-scheme:dark;
  --bg:#0c1218; --panel:#121b25; --panel-2:#192431; --line:#263444; --line-2:#334457;
  --fg:#e5ebf1; --muted:#8a9aac; --faint:#5c6c7e;
  --accent:#f4b13f; --accent-ink:#1b1305;
  --danger:#ff5d5d; --ok:#45d08f; --mil:#c084fc;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-ui:'Barlow',system-ui,-apple-system,sans-serif;
  --font-data:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#edf0f3; --panel:#ffffff; --panel-2:#f2f5f8; --line:#d3dbe4; --line-2:#b9c5d2;
    --fg:#141d27; --muted:#5a6b7d; --faint:#8b9aab;
    --accent:#c27a06; --accent-ink:#fff;
    --danger:#d12f3a; --ok:#15915b; --mil:#7c3aed;
    --shadow:0 10px 30px rgba(20,30,40,.18);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#edf0f3; --panel:#ffffff; --panel-2:#f2f5f8; --line:#d3dbe4; --line-2:#b9c5d2;
  --fg:#141d27; --muted:#5a6b7d; --faint:#8b9aab;
  --accent:#c27a06; --accent-ink:#fff;
  --danger:#d12f3a; --ok:#15915b; --mil:#7c3aed;
  --shadow:0 10px 30px rgba(20,30,40,.18);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#map{position:absolute;inset:0;background:var(--bg)}
.streets-dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.55)}
.leaflet-container{font-family:var(--font-ui);background:var(--bg)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--muted);font-size:10px}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-bar a{background:var(--panel);color:var(--fg);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--panel-2)}
.leaflet-bar{border:1px solid var(--line);box-shadow:var(--shadow)}

/* Header strip */
#top{position:absolute;z-index:1000;top:0;left:0;right:0;
  padding-top:calc(8px + env(safe-area-inset-top,0px));
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px 6px 8px;box-shadow:var(--shadow);min-width:0}
.brand .mark{width:22px;height:22px;flex:none;color:var(--accent)}
.brand h1{margin:0;font:700 20px/1 var(--font-display);letter-spacing:.02em;text-transform:uppercase}
/* The status has a fixed width so the search box and toolbar never shift when its text changes length. */
.status{display:flex;align-items:center;gap:7px;font:500 12px/1 var(--font-data);color:var(--muted);white-space:nowrap;padding-left:10px;border-left:1px solid var(--line);width:300px;flex:none;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.status{width:auto;flex:1}}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
#statusText{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:899px){.brand{flex:1 1 100%}}
.status.live .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 30%,transparent)}
.status.err .dot{background:var(--danger)}
.status.paused .dot{background:var(--accent)}
.search{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:4px 6px 4px 10px;box-shadow:var(--shadow);flex:1 1 200px;min-width:160px;max-width:420px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:5px 0;font-family:var(--font-data);font-size:13px;text-transform:uppercase}
.search input::placeholder{color:var(--faint);text-transform:none;font-family:var(--font-ui)}
.search input:focus-visible{outline:none}
.search:focus-within{border-color:var(--accent)}
.ibtn{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);color:var(--fg);flex:none;padding:0}
.ibtn svg{width:18px;height:18px}
.ibtn:hover{background:var(--panel-2)}
.ibtn.on{color:var(--accent);border-color:var(--accent)}
.ibtn:focus-visible,.search input:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:6px;margin-left:auto} /* pinned to the right edge */

/* Aircraft markers. Each icon is drawn twice: a thick halo copy underneath (its color depends on the
   map style, so planes stay readable over satellite imagery and separate from each other when they
   overlap), then the altitude-colored body on top. */
.ac{position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#9aa5b1;transition:opacity .4s;--halo:rgba(8,12,18,.7);--halo-w:2.4}
.ac>svg{width:22px;height:22px;overflow:visible;shape-rendering:geometricPrecision;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.85));transition:transform .6s ease}
.ac>svg .halo *{fill:var(--halo);stroke:var(--halo);stroke-width:var(--halo-w);stroke-linejoin:round;stroke-linecap:round;opacity:1}
[data-map="light"] .ac,[data-map="streets"]:not(.streets-dark) .ac{--halo:#fff}
[data-map="satellite"] .ac{--halo:#fff;--halo-w:3}
[data-map="satellite"] .ac>svg{filter:drop-shadow(0 0 2px rgba(0,0,0,.95))}
.ac.veh>svg{width:12px;height:12px}
/* Ground traffic piles up at airports when zoomed out: hide it below zoom 11 (body.zoom-mid) unless
   it is selected or squawking an emergency. It stays in the fleet, the list and search. The class goes on
   Leaflet's marker container (not the inner .ac) so a hidden marker cannot intercept clicks either. */
body:not(.zoom-mid) .leaflet-marker-icon.gnd-hidden{display:none}
.ac .lbl{position:absolute;left:30px;top:50%;transform:translateY(-50%);font:500 11px/1 var(--font-data);color:var(--fg);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:2px 5px;border-radius:4px;white-space:nowrap;display:none;pointer-events:none;letter-spacing:.02em}
.labels-on .ac .lbl{display:block}
.labels-on .ac.gnd .lbl{display:none}
.labels-on.zoom-tight .ac.gnd .lbl{display:block} /* ground labels only from zoom 13: ramps are a pile at 12 */
.ac.gnd>svg{width:18px;height:18px} /* parked aircraft draw a little smaller so ramps stay legible */
.ac.stale{opacity:.4}
/* Role badge (military star, police shield, news camera, medical cross): a disc at the top-right corner of the
   marker box, outside the rotated svg so it always stays upright; the callsign label moves over to make room. */
.ac .bdg{position:absolute;top:-4px;right:-3px;width:13px;height:13px;border-radius:50%;display:none;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.9),0 1px 3px rgba(0,0,0,.7)}
.ac.badged .bdg{display:block}
.ac .bdg svg{display:block;width:100%;height:100%}
.ac.badged .lbl{left:33px}
.ac.gnd .bdg{top:-2px;right:-1px;width:11px;height:11px}
.ac.sel::before,.ac.emg::before{content:"";position:absolute;inset:-3px;border:2px solid var(--accent);border-radius:50%}
.ac.emg::before{border-color:var(--danger);animation:pulse 1s ease-in-out infinite}
.ac.sel{z-index:5}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.35}}
@media (prefers-reduced-motion:reduce){.ac>svg{transition:none}.ac.emg::before{animation:none}}

/* Airport markers: a small diamond with the IATA code beside it; the name appears when zoomed in. They sit in
   their own pane under the aircraft, so an aircraft over an airport always wins the click; the diamond and the
   code label take clicks (zoom to the airport), the rest of the marker box does not. */
.leaflet-marker-icon.apt-icon{pointer-events:none}
.apt-icon.hide{display:none}
.apt{position:relative;width:10px;height:10px;color:var(--muted);opacity:.85}
.apt .glyph{position:absolute;inset:1px;border:1.5px solid currentColor;border-radius:1px;transform:rotate(45deg);background:color-mix(in srgb,var(--bg) 55%,transparent);pointer-events:auto;cursor:pointer}
.apt .glyph:hover{border-color:var(--accent)}
.apt .lbl{position:absolute;left:14px;top:50%;transform:translateY(-50%);white-space:nowrap;text-shadow:0 0 2px var(--bg),0 0 3px var(--bg),0 1px 2px var(--bg);pointer-events:auto;cursor:pointer}
.apt .lbl:hover .code{color:var(--accent);opacity:1}
.apt .code{display:block;font:600 11px/1 var(--font-display);letter-spacing:.08em;color:var(--fg);opacity:.8}
.apt .gcount{font:500 10px/1 var(--font-data);letter-spacing:0;color:var(--muted);margin-left:6px} /* "12 on ground" while ground traffic is hidden */
.apt .gcount:empty{display:none}
.apt .name{display:none;font:400 10px/1.1 var(--font-ui);margin-top:2px}
.apt-icon.named .apt .name{display:block}
.apt.t3{color:var(--faint)}
.apt.t3 .glyph{inset:2px;border-width:1.2px}
.apt.t3 .code{font-size:10px;opacity:.65}

/* Legend */
#legend{position:absolute;z-index:900;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-shadow:var(--shadow);width:150px}
#legend .bar{height:6px;border-radius:3px;background:linear-gradient(90deg,#8e99a6 0 8%,#f6c448 8%,#f0963c 18%,#78c85a 32%,#3cbeaa 46%,#4696eb 62%,#6e6ef0 78%,#b95fe6 92%,#e65ac8)}
#legend .ticks{display:flex;justify-content:space-between;font:500 9px/1 var(--font-data);color:var(--muted);margin-top:4px;letter-spacing:.02em}
#legend .cap{font:600 10px/1 var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
#legend .wx{font:500 9px/1.2 var(--font-data);color:var(--muted);margin-top:6px;padding-top:5px;border-top:1px solid var(--line)}
#legend .keys{display:flex;flex-wrap:wrap;gap:3px 8px;margin-top:6px;padding-top:5px;border-top:1px solid var(--line);font:500 9px/1.2 var(--font-data);color:var(--muted)}
#legend .keys span{display:inline-flex;align-items:center;gap:3px}
#legend .keys svg{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
/* overlays: range rings (own SVG pane) and the rain radar tiles; neither takes pointer events */
.leaflet-rings-pane,.leaflet-weather-pane{pointer-events:none}
.ring{stroke:var(--fg);stroke-opacity:.35;stroke-dasharray:3 5}
.ring-c{stroke:var(--fg);stroke-opacity:.6;fill:var(--fg);fill-opacity:.6}
.ring-lbl{font:500 10px/1 var(--font-data);color:var(--fg);opacity:.7;white-space:nowrap;transform:translate(-50%,-115%);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.field label small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}

/* Detail panel */
#panel{position:absolute;z-index:1100;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;
  left:0;right:0;bottom:0;max-height:64%;border-radius:16px 16px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(105%);transition:transform .25s ease}
#panel.open{transform:none}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
@media (min-width:900px){
  #panel{left:auto;right:max(10px,env(safe-area-inset-right,0px));top:calc(60px + env(safe-area-inset-top,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:380px;max-height:none;border-radius:14px;transform:translateX(120%)}
  #panel.open{transform:none}
}
.ph{display:flex;align-items:center;gap:8px;padding:8px 12px 6px;border-bottom:1px solid var(--line);flex:none}
.ph .grab{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 6px;display:block}
@media (min-width:900px){.ph .grab{display:none}}
.ph h2{margin:0;font:600 13px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:1}
.pbody{overflow:auto;padding:10px 12px 14px;min-width:0;overscroll-behavior:contain}
.ac-head{display:flex;gap:10px;align-items:flex-start}
.ac-head .cs{font:700 34px/1 var(--font-display);letter-spacing:.02em;min-width:0}
.ac-head .op{color:var(--muted);font-size:13px;margin-top:3px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.badge{font:600 10px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.badge.mil{color:var(--mil);border-color:var(--mil)}
.badge.emg{color:#fff;background:var(--danger);border-color:var(--danger)}
.badge.gnd{color:var(--accent);border-color:var(--accent)}
.badge.police,.list .tag.police{color:#5b8def;border-color:#5b8def}
.badge.news,.list .tag.news{color:var(--fg);border-color:var(--muted)}
.badge.medical,.list .tag.medical{color:var(--danger);border-color:var(--danger)}
.photo{margin:10px 0 2px;border-radius:8px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);display:none}
.photo img{display:block;width:100%;height:auto;max-height:240px;object-fit:cover}
.photo .credit{font-size:11px;color:var(--muted);padding:5px 8px;line-height:1.4}
.photo .credit a{color:var(--muted)}
.photo .tag{display:inline-block;font:600 9px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:2px 4px;margin-right:6px;vertical-align:1px}
.route{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin:10px 0 4px;padding:8px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.route .code{font:700 24px/1 var(--font-display);letter-spacing:.04em}
.route .name{font-size:11px;color:var(--muted);line-height:1.25;margin-top:2px}
.route .arrow{color:var(--accent)}
.route .to{text-align:right}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.tile .k{font:600 10px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:500 20px/1.15 var(--font-data);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:11px;color:var(--muted);margin-top:2px}
.rows{margin:12px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.rows li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.rows li .k{color:var(--muted);flex:none}
.rows li .v{font-family:var(--font-data);font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 11px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--line-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.hint{color:var(--muted);font-size:12px;margin-top:8px}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.list li:hover{background:var(--panel-2)}
.list .cs{font:600 15px/1.1 var(--font-data)}
.list .ty{font-size:11px;color:var(--muted)}
.list .alt{font:500 13px/1.1 var(--font-data);text-align:right;font-variant-numeric:tabular-nums}
.list .d{font-size:11px;color:var(--muted);text-align:right}
.list .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.list .tag{font:600 9px/1 var(--font-ui);letter-spacing:.06em;padding:2px 4px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle}
.list .tag.mil{color:var(--mil);border-color:var(--mil)}
.list .tag.emg{color:var(--danger);border-color:var(--danger)}
/* list toolbar: filter chips + sort, sticky over the rows (negative top/margin swallow the panel body's padding) */
.ltools{position:sticky;top:-10px;z-index:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-10px 0 4px;padding:10px 0 8px;background:var(--panel)}
.chip{font:600 11px/1 var(--font-ui);letter-spacing:.02em;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);color:var(--muted);cursor:pointer}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.lsort{margin-left:auto;font:500 12px var(--font-ui);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px 6px;max-width:48%}
.lmore{display:block;width:100%;margin-top:8px;padding:9px;font:600 12px var(--font-ui);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.lmore:hover{border-color:var(--line-2)}
.empty{color:var(--muted);padding:18px 4px;text-align:center}

/* Settings sheet */
#settings{position:absolute;z-index:1200;top:calc(56px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:min(340px,calc(100vw - 20px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
@media (max-width:899px){
  #settings{top:auto;bottom:0;left:0;right:0;width:auto;border-radius:16px 16px 0 0;max-height:72%;overflow:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
}
#settings h3{margin:0 0 8px;font:600 13px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.field:last-of-type{border-bottom:0}
.field label{font-size:13px}
.field input[type=text],.field select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:58%;min-width:0;font-family:var(--font-data);font-size:12px}
.field input[type=range]{width:120px;accent-color:var(--accent)}
.field input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.field .val{font-family:var(--font-data);font-size:12px;color:var(--muted);min-width:44px;text-align:right}
.note{font-size:11px;color:var(--muted);margin:8px 0 0;line-height:1.4}

/* Blocked / offline banner */
#blocked{position:absolute;z-index:1300;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(460px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:13px;line-height:1.45}
#blocked b{font-family:var(--font-display);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
#blocked .x{float:right;background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:0 2px}
</style>
</head>
<body>
<div id="app">
  <div id="map" role="application" aria-label="Live aircraft map"></div>

  <header id="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6"/><path d="M12 12 L20.5 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
      <h1>FlightScope</h1>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
    </div>
    <label class="search" aria-label="Search aircraft">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Callsign, tail, hex, type…" autocomplete="off" spellcheck="false">
    </label>
    <div class="tools">
      <button class="ibtn" id="btnList" title="Nearby aircraft" aria-label="Nearby aircraft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <button class="ibtn" id="btnLocate" title="Center on my location" aria-label="Center on my location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
      <button class="ibtn" id="btnPause" title="Pause updates" aria-label="Pause updates"><svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg><svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M7 4l13 8-13 8z"/></svg></button>
      <button class="ibtn" id="btnSettings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    </div>
  </header>

  <div id="legend" aria-hidden="true">
    <div class="cap">Altitude</div>
    <div class="bar"></div>
    <div class="ticks"><span>GND</span><span>5k</span><span>15k</span><span>30k</span><span>45k</span></div>
    <div class="keys"></div>
    <div class="wx" hidden></div>
  </div>

  <aside id="panel" aria-label="Aircraft details">
    <div class="ph">
      <span class="grab"></span>
      <h2 id="panelTitle">Aircraft</h2>
      <button class="ibtn" id="btnClose" title="Close" aria-label="Close panel" style="width:30px;height:30px;box-shadow:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="pbody" id="pbody"></div>
  </aside>

  <div id="settings" hidden>
    <h3>Settings</h3>
    <div class="field"><label for="sProxy">Data relay URL</label><input type="text" id="sProxy" placeholder="http://127.0.0.1:8787/api"></div>
    <div class="field"><label for="sInterval">Refresh</label><select id="sInterval"><option value="3">every 3 s</option><option value="5">every 5 s</option><option value="10">every 10 s</option><option value="20">every 20 s</option></select></div>
    <div class="field"><label for="sRadius">Max search radius</label><span><input type="range" id="sRadius" min="25" max="250" step="5"><span class="val" id="sRadiusVal"></span></span></div>
    <div class="field"><label for="sTrailMin">Keep trails for</label><select id="sTrailMin"><option value="15">15 min</option><option value="30">30 min</option><option value="60">1 hour</option><option value="120">2 hours</option></select></div>
    <div class="field"><label for="sTrails">Trail for selected aircraft</label><input type="checkbox" id="sTrails"></div>
    <div class="field"><label for="sLabels">Callsign labels</label><input type="checkbox" id="sLabels"></div>
    <div class="field"><label for="sAirports">Airport markers</label><input type="checkbox" id="sAirports"></div>
    <div class="field"><label for="sTheme">Map style</label><select id="sTheme"><option value="auto">Match device</option><option value="dark">Dark</option><option value="light">Light</option><option value="satellite">Satellite</option><option value="streets">Streets (OSM)</option></select></div>
    <div class="field"><label for="sUnits">Units</label><select id="sUnits"><option value="aviation">ft · kt · nm</option><option value="metric">m · km/h · km</option></select></div>
    <div class="field"><label for="sStart">On launch <small>Goes to your location; stays where you left it if location is off.</small></label><select id="sStart"><option value="0">Where I left the map</option><option value="2000">My location</option><option value="10000">My location</option><option value="35000">My location</option></select></div>
    <div class="field"><label for="sRings">Range rings <small>Centred where you switch them on; Locate moves them to you.</small></label><input type="checkbox" id="sRings"></div>
    <div class="field"><label for="sWeather">Rain radar overlay <small>Latest RainViewer frame, refreshed every 5 min.</small></label><input type="checkbox" id="sWeather"></div>
    <p class="note" id="srcNote"></p>
    <p class="note"><a id="privacyLink" href="privacy" target="_blank" rel="noopener">Privacy &amp; data sources</a></p>
  </div>

  <div id="blocked" hidden role="status">

const AIRPORT_ZOOM = { 1: [6, 9], 2: [8, 10], 3: [10, 11] }; // tier -> [marker shows from zoom, name shows from zoom]
map.createPane('airports').style.zIndex = 450; // above trails and reference labels (400), below aircraft (600)
const airportLayer = L.layerGroup();
for (const [iata, icao, name, lat, lon, tier] of AIRPORTS) {
  const icon = L.divIcon({ className: 'apt-icon', iconSize: [10, 10], iconAnchor: [5, 5], html: `<div class="apt t${tier}"><span class="glyph"></span><span class="lbl"><span class="code">${esc(iata)}<span class="gcount"></span></span><span class="name">${esc(name)}</span></span></div>` });
  const m = L.marker([lat, lon], { icon, pane: 'airports', keyboard: false, tier, title: `${name} · ${iata} / ${icao}` }).addTo(airportLayer);
  m.on('click', () => map.flyTo([lat, lon], Math.max(map.getZoom(), 12), { duration: 0.8 }));
}
function syncAirports() {
  if (!!settings.airports !== map.hasLayer(airportLayer)) { if (settings.airports) airportLayer.addTo(map); else map.removeLayer(airportLayer); }
  if (!settings.airports) return;
  const z = map.getZoom();
  airportLayer.eachLayer(m => {
    const el = m.getElement(); if (!el) return;
    const [show, named] = AIRPORT_ZOOM[m.options.tier];
    el.classList.toggle('hide', z < show); el.classList.toggle('named', z >= named);
  });
  updateAirportCounts();
}
/* While ground traffic is hidden (below GROUND_MIN_ZOOM), each visible airport label shows how many aircraft are
   on the ground within ~4 km of its reference point, so a busy ramp is still visible from a distance. */
let haveFeed = false; // the fleet state is declared further down; nothing to count until the first feed lands
function updateAirportCounts() {
  if (!haveFeed || !settings.airports || !map.hasLayer(airportLayer)) return;
  const z = map.getZoom(), counting = z < GROUND_MIN_ZOOM, gnd = [];
  if (counting) for (const rec of fleet.values()) { const a = rec.a; if (a.alt_baro === 'ground' && feedNow - rec.lastSeen < 60000) gnd.push(a); }
  const b = map.getBounds().pad(0.2);
  airportLayer.eachLayer(m => {
    const el = m.getElement(); if (!el) return;
    const span = el.querySelector('.gcount');
    let n = 0;
    if (gnd.length && !el.classList.contains('hide') && b.contains(m.getLatLng())) {
      const ll = m.getLatLng(), dLon = 0.04 / Math.cos(ll.lat * Math.PI / 180);
      for (const a of gnd) if (Math.abs(a.lat - ll.lat) < 0.04 && Math.abs(a.lon - ll.lng) < dLon) n++;
    }
    const txt = n ? `${n} on ground` : '';
    if (span.textContent !== txt) span.textContent = txt;
  });
}

const GROUND_MIN_ZOOM = 11; // below this, ground traffic is hidden so airports don't turn into a pile of markers
function syncZoomClass() {
  const z = map.getZoom(), b = document.body.classList;
  b.toggle('labels-on', settings.labels && z >= 10);
  b.toggle('zoom-mid', z >= GROUND_MIN_ZOOM);
  b.toggle('zoom-close', z >= 12);
  b.toggle('zoom-tight', z >= 13);
  syncAirports();
}
map.on('zoomend', syncZoomClass); syncZoomClass();

/* ---------- state ---------- */
const fleet = new Map();     // hex -> record
let selected = null;         // hex
let paused = false, timer = null, lastFeedAt = 0, feedNow = 0, lastSource = '—', lastVia = null, consecutiveErrors = 0, firstSuccess = false;
let ridingOut = false; // a missed refresh or a few after a good one: keep the picture (markers keep gliding) and say "retrying"
const RELAY_GRACE_MS = 120000, RIDE_OUT_ERRORS = 6;
const relayRecent = () => lastVia === 'relay' && Date.now() - lastFeedAt < RELAY_GRACE_MS;
const photoCache = new Map(), routeCache = new Map();
let listMode = false, query = '';

/* ---------- data fetching ---------- */
const LOCAL_RELAY = 'http://127.0.0.1:8787/api';
function proxyBase() {
  const s = (settings.proxy || '').trim().replace(/\/+$/, '');
  if (s) return s;
  if (window.FLIGHTSCOPE_RELAY) return String(window.FLIGHTSCOPE_RELAY).replace(/\/+$/, '') + '/api'; // injected by a host that embeds the page (the iOS app)
  if (/^https?:$/.test(location.protocol)) return location.origin + '/api';
  return LOCAL_RELAY; // opened as a file: use the relay started by FlightScope.cmd on this computer
}
/* Public CORS relays: last resort when no FlightScope relay is running. Slower and not guaranteed. */
const PUBLIC_RELAYS = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)
];
const UPSTREAM_FEED = (lat, lon, dist) => `https://opendata.adsb.fi/api/v2/lat/${lat}/lon/${lon}/dist/${dist}`;
function currentRadius() {
  const c = map.getCenter(), b = map.getBounds();
  const nm = c.distanceTo(b.getNorthEast()) / 1852;

/* The flight list: every aircraft in the fleet that matches the search box and the active filter chip, in the chosen
   sort order, rendered LIST_PAGE rows at a time (a "Show more" button, auto-pressed when scrolled into view). The

   sort dropdown or a scrolled position survives the refresh. Filter and sort persist in settings. */
const LIST_PAGE = 100;
const LIST_FILTERS = [ // [key, chip label, empty-state text]
  ['all', 'All', 'No aircraft in range yet.'],
  ['air', 'Airborne', 'No airborne aircraft in range right now.'],
  ['gnd', 'On ground', 'No aircraft on the ground in range right now.'],
  ['heli', 'Helicopters', 'No helicopters in range right now.'],
  ['mil', 'Military', 'No military aircraft in range right now.'],
  ['emg', 'Alerts', 'No emergency squawks in range right now.'],
];
const LIST_SORTS = [['dist', 'Nearest first'], ['altDesc', 'Highest first'], ['altAsc', 'Lowest first'], ['gs', 'Fastest first'], ['cs', 'Callsign A–Z'], ['recent', 'Newest in feed']];
function listMatch(a, f) {
  switch (f) {
    case 'air': return a.alt_baro !== 'ground';
    case 'gnd': return a.alt_baro === 'ground';
    case 'heli': return shapeFor(a) === 'heli';
    case 'mil': return isMil(a);
    case 'emg': return !!squawkAlert(a);
    default: return true;
  }
}
function altOf(a) { return a.alt_baro === 'ground' ? -1 : isNum(a.alt_baro) ? a.alt_baro : isNum(a.alt_geom) ? a.alt_geom : -2; }
const LIST_CMP = {
  dist: (x, y) => x.d - y.d,
  altDesc: (x, y) => altOf(y.rec.a) - altOf(x.rec.a) || x.d - y.d,
  altAsc: (x, y) => (altOf(x.rec.a) < 0) - (altOf(y.rec.a) < 0) || altOf(x.rec.a) - altOf(y.rec.a) || x.d - y.d, // ground/unknown last
  gs: (x, y) => (isNum(y.rec.a.gs) ? y.rec.a.gs : -1) - (isNum(x.rec.a.gs) ? x.rec.a.gs : -1) || x.d - y.d,
  cs: (x, y) => x.noId - y.noId || x.cs.localeCompare(y.cs) || x.d - y.d, // hex-only entries ("~2A3B4C") after real callsigns
  recent: (x, y) => y.rec.firstSeen - x.rec.firstSeen || x.d - y.d,

let listShown = LIST_PAGE;
function listRow(it) {
  const a = it.rec.a, tags = [];
  const role = roleOf(a);
  if (role) tags.push('<span class="tag ' + role + '">' + BADGES[role].tag + '</span>');
  if (isMil(a) && role !== 'mil') tags.push('<span class="tag mil">MIL</span>');

function renderList(body) {
  const q = query.trim().toUpperCase(), center = map.getCenter();
  const filter = LIST_FILTERS.find(x => x[0] === settings.listFilter) || LIST_FILTERS[0], f = filter[0];
  const items = []; let total = 0;
  for (const rec of fleet.values()) {
    const a = rec.a; total++;
    const cs = (a.flight || '').trim();
    if (q) {
      const hay = [cs, a.r, a.hex, a.t, a.ownOp, a.desc, a.squawk].filter(Boolean).join(' ').toUpperCase();
      if (!hay.includes(q)) continue;
    }

  }

  let tools = body.querySelector('.ltools');
  if (!tools) { // first render since the panel last showed something else: build the toolbar and wire it once
    listShown = LIST_PAGE;
    body.innerHTML = `<div class="ltools">${LIST_FILTERS.map(([k, l]) => `<button type="button" class="chip" data-f="${k}">${l}</button>`).join('')}<select class="lsort" aria-label="Sort aircraft">${LIST_SORTS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div><ul class="list" id="llist"></ul><div id="lfoot"></div>`;
    tools = body.querySelector('.ltools');

    tools.querySelector('.lsort').addEventListener('change', e => { settings.listSort = e.target.value; save('settings', settings); listShown = LIST_PAGE; renderList(body); });
    ul.addEventListener('click', e => { const li = e.target.closest('li[data-hex]'); if (!li) return; const rec = fleet.get(li.dataset.hex); if (rec && rec.marker) { select(rec.hex); const ll = rec.marker.getLatLng(); if (!map.getBounds().contains(ll)) map.setView(ll, Math.max(map.getZoom(), 9)); } });
    foot.addEventListener('click', e => { if (e.target.closest('.lmore') && listMode && !selected) { listShown += LIST_PAGE; renderList(body); } });
    new IntersectionObserver(es => { if (es.some(x => x.isIntersecting) && foot.isConnected && listMode && !selected) { const b = foot.querySelector('.lmore'); if (b) b.click(); } }, { root: body, rootMargin: '120px' }).observe(foot);
  }
  tools.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.dataset.f === f));

}

function syncLegend() { const u = units(); $('#legend .cap').textContent = u.cap; $('#legend .ticks').innerHTML = u.legend.map(x => `<span>${x}</span>`).join('');
  $('#legend .keys').innerHTML = Object.values(BADGES).map(b => '<span>' + b.svg + b.name + '</span>').join(''); }

function syncSettingsUI() {
  $('#sProxy').value = settings.proxy || ''; $('#sInterval').value = String(settings.interval); $('#sRadius').value = settings.maxRadius; $('#sRadiusVal').textContent = fmtDist(settings.maxRadius, 0);
  $('#sTrailMin').value = String(settings.trailMin); $('#sTrails').checked = settings.trails; $('#sLabels').checked = settings.labels; $('#sAirports').checked = settings.airports; $('#sTheme').value = settings.theme;
  $('#sUnits').value = settings.units; $('#sRings').checked = settings.rings; $('#sWeather').checked = settings.weather;
  for (const o of $('#sStart').options) if (+o.value) o.textContent = 'My location · ' + fmtAltV(+o.value) + ' up'; // follows the units
  $('#sStart').value = String(settings.startView);
}
syncSettingsUI(); syncLegend(); syncOverlays();
function commit() { // syncZoomClass also syncs airports; the panel/list re-render so a units change shows at once
  save('settings', settings); syncZoomClass(); applyTheme(); syncLegend(); syncOverlays(); syncSettingsUI();
  if (!settings.trails) selTrailLayer.clearLayers(); else renderSelectedTrail();
  if ($('#panel').classList.contains('open')) renderPanel();
}
$('#sProxy').addEventListener('change', e => { settings.proxy = e.target.value.trim(); lastVia = null; commit(); tick(); });
$('#sInterval').addEventListener('change', e => { settings.interval = +e.target.value; commit(); });
$('#sRadius').addEventListener('input', e => { settings.maxRadius = +e.target.value; $('#sRadiusVal').textContent = fmtDist(settings.maxRadius, 0); });
$('#sRadius').addEventListener('change', () => { commit(); tick(); });
$('#sTrailMin').addEventListener('change', e => { settings.trailMin = +e.target.value; commit(); });
$('#sTrails').addEventListener('change', e => { settings.trails = e.target.checked; commit(); });
$('#sLabels').addEventListener('change', e => { settings.labels = e.target.checked; commit(); });
$('#sAirports').addEventListener('change', e => { settings.airports = e.target.checked; commit(); });
$('#sTheme').addEventListener('change', e => { settings.theme = e.target.value; commit(); });
$('#sUnits').addEventListener('change', e => { settings.units = e.target.value; commit(); });
$('#sStart').addEventListener('change', e => { settings.startView = +e.target.value; commit(); });
$('#sRings').addEventListener('change', e => { settings.rings = e.target.checked; if (settings.rings) { const c = map.getCenter(); settings.ringsAt = { lat: c.lat, lon: c.lng }; } commit(); });
$('#sWeather').addEventListener('change', e => { settings.weather = e.target.checked; commit(); });
map.on('click', () => { if (selected) closePanel(); });

/* status age ticker */
setInterval(() => { if (!paused && firstSuccess && (!consecutiveErrors || ridingOut)) { const s = Math.round((Date.now() - lastFeedAt) / 1000); $('#statusText').textContent = `${lastSource} · ${fleet.size} aircraft · ${s}s ago${ridingOut ? ' · retrying' : ''}`; } }, 1000);

let deepLinked = false; // a shared link chose the view: the launch does not move to the device's location
/* Deep link (what Share produces): #icao=hex&lat=..&lon=..&z=.. views that spot and selects the aircraft once the feed has it. */
{
  const deepLink = {}; for (const kv of location.hash.replace(/^#/, '').split('&')) { const i = kv.indexOf('='); if (i > 0) try { deepLink[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1)); } catch (e) {} }
  const lat = parseFloat(deepLink.lat), lon = parseFloat(deepLink.lon);
  if (/^[0-9a-f]{6}$/i.test(deepLink.icao || '')) pendingHex = deepLink.icao.toLowerCase();
  if (isNum(lat) && isNum(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) map.setView([lat, lon], Math.min(14, Math.max(7, parseInt(deepLink.z, 10) || 10)), { animate: false });
  deepLinked = !!(pendingHex || isNum(lat));
  if (pendingHex || isNum(lat)) try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
nativePost('ready', { version: 1 });
/* Start at my location (settings.startView = camera height in ft, 0 = keep the view the map was left at). A drag, zoom or
   selection before the location arrives wins; no location (denied, http on a LAN address, timeout) leaves the saved view. */
if (settings.startView > 0 && !deepLinked) {
  let touched = false; const mark = () => { touched = true; };
  map.on('dragstart zoomstart', mark);
  requestLocation(pos => {
    map.off('dragstart zoomstart', mark);
    if (pos && !touched && !selected) showLocation(pos, zoomForEye(settings.startView, pos.lat), false);
  }, 300000);
}
tick();
})();
</script>
</body>
